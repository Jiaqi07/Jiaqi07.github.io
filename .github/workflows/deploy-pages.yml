# Build and deploy to GitHub Pages (jiaqi07.github.io)
# Repo must be named jiaqi07.github.io and Settings > Pages > Source = "Deploy from a branch" > branch: gh-pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        run: |
          cd personal-website
          npm install
          npm run build

      # GitHub Pages serves 404.html for unknown paths - copy index so SPA routes work
      - name: Add 404 fallback for SPA routing
        run: cp personal-website/build/index.html personal-website/build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: personal-website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
